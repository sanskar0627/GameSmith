<!doctype html>
<!-- DEMO GAME: placeholder for sandbox-built games. Plain canvas, no deps. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Floating Islands (demo)</title>
<style>
  html,body{margin:0;height:100%;background:#121110;overflow:hidden}
  canvas{width:100%;height:100%;image-rendering:pixelated;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Floating Islands demo game. Arrows or WASD to move, Space to jump."></canvas>
<script>
(() => {
  const view = document.getElementById("c"), vctx = view.getContext("2d");
  const W = 320, H = 180;
  const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
  const g = buf.getContext("2d");
  const C = { night:"#121110", ink:"#1c1b19", e9:"#66240e", e8:"#8f3112", e5:"#e4663a", e2:"#f6c2a7", bone:"#f3eee2", mid:"#45433f" };
  const B = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  const islands = [[10,140,70],[95,120,50],[165,104,46],[228,126,40],[270,92,44]];
  let crystals, player, keys = {}, won = false, t = 0;
  function reset(){ crystals = [[40,128],[115,108],[185,92],[245,114],[292,80]].map(([x,y])=>({x,y,got:false})); player={x:20,y:120,vx:0,vy:0,ground:false}; won=false; }
  reset();
  addEventListener("keydown", e => { keys[e.code]=true; if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault(); });
  addEventListener("keyup", e => { keys[e.code]=false; });
  view.addEventListener("pointerdown", () => view.focus());
  function dither(x0,y0,w,h,c1,c2,f){ for(let y=y0;y<y0+h;y++) for(let x=x0;x<x0+w;x++){ const v=f(x,y); g.fillStyle = v > (B[(y&3)*4+(x&3)]+.5)/16 ? c2 : c1; g.fillRect(x,y,1,1);} }
  let skyCache = null;
  function sky(){
    if (skyCache) { g.drawImage(skyCache, 0, 0); return; }
    dither(0,0,W,H,C.night,C.e9,(x,y)=>Math.pow(y/H,2.2)*.9);
    const sx=250, sy=60, r=26;
    for(let y=sy-r;y<sy+r;y++) for(let x=sx-r;x<sx+r;x++){ const d=(x-sx)**2+(y-sy)**2; if(d<r*r){ const k=(y-(sy-r))/(2*r); g.fillStyle = (1-k*0.9) > (B[(y&3)*4+(x&3)]+.5)/16 ? C.e5 : C.e9; g.fillRect(x,y,1,1);} }
    skyCache = document.createElement("canvas"); skyCache.width = W; skyCache.height = H; skyCache.getContext("2d").drawImage(buf, 0, 0);
  }
  function step(){
    const L = keys.ArrowLeft||keys.KeyA, R = keys.ArrowRight||keys.KeyD, J = keys.Space||keys.ArrowUp||keys.KeyW;
    player.vx = (R?1.4:0) - (L?1.4:0);
    if (J && player.ground) { player.vy = -3.6; player.ground = false; }
    player.vy = Math.min(player.vy + 0.18, 4); player.x += player.vx; player.y += player.vy; player.ground = false;
    for (const [ix,iy,iw] of islands) if (player.x+6>ix && player.x<ix+iw && player.y+10>=iy && player.y+10-player.vy<=iy+2 && player.vy>=0){ player.y=iy-10; player.vy=0; player.ground=true; }
    player.x = Math.max(0, Math.min(W-6, player.x));
    if (player.y > H+20) { player.x=20; player.y=120; player.vy=0; }
    for (const c of crystals) if(!c.got && Math.abs(player.x+3-c.x)<6 && Math.abs(player.y+5-c.y)<8) c.got = true;
    won = crystals.every(c=>c.got);
  }
  function draw(){
    sky();
    for (const [ix,iy,iw] of islands){ g.fillStyle=C.e5; g.fillRect(ix,iy,iw,2); g.fillStyle=C.ink; g.fillRect(ix,iy+2,iw,6); for(let k=0;k<iw;k+=4){ g.fillRect(ix+k+1,iy+8,2,4+((k*7)%6)); } }
    for (const c of crystals) if(!c.got){ const bob=Math.sin(t/12+c.x)*1.5; g.fillStyle=C.e2; g.fillRect(c.x-1,c.y-3+bob,2,6); g.fillRect(c.x-2,c.y-1+bob,4,2); }
    g.fillStyle=C.bone; g.fillRect(player.x,player.y,6,10); g.fillStyle=C.e5; g.fillRect(player.x-2+(player.vx<0?6:0),player.y+3,3,2); g.fillStyle=C.ink; g.fillRect(player.x+ (player.vx<0?1:3),player.y+2,2,2);
    const got = crystals.filter(c=>c.got).length;
    g.fillStyle=C.bone; g.font="8px monospace"; g.fillText(`CRYSTALS ${got}/${crystals.length}`, 6, 12);
    if (won){ g.fillStyle="rgba(18,17,16,.75)"; g.fillRect(0,70,W,40); g.fillStyle=C.e5; g.fillText("ALL CRYSTALS! THE CASTLE OPENS.", 88, 92); }
    else if (t < 300) { g.fillStyle=C.mid; g.fillText("ARROWS/WASD MOVE  SPACE JUMP", 6, H-6); }
  }
  function fit(){ const s = Math.max(1, Math.floor(Math.min(innerWidth/W, innerHeight/H))); view.width = innerWidth; view.height = innerHeight; vctx.imageSmoothingEnabled=false; vctx.fillStyle=C.night; vctx.fillRect(0,0,view.width,view.height); const sc=Math.min(innerWidth/W, innerHeight/H); const dw=W*sc, dh=H*sc; vctx.drawImage(buf,(innerWidth-dw)/2,(innerHeight-dh)/2,dw,dh); }
  function loop(){ t++; step(); draw(); fit(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
